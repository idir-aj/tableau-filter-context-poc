<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Context Apply (B)</title>
  <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 8px; }
    #status { font-size: 12px; opacity: .75; white-space: pre-wrap; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div id="status" class="hidden"></div>

<script>
(async () => {
  await tableau.extensions.initializeAsync({ configure: openConfigDialog });

  // ✅ Hardcode API URL here
  const API_BASE = "https://TON-API.onrender.com";

  const statusEl = document.getElementById("status");
  const showStatus = (m) => {
    statusEl.textContent = m || "";
    statusEl.classList.toggle("hidden", !m);
  };

  function getJsonSetting(key, fallback) {
    const raw = tableau.extensions.settings.get(key);
    if (!raw) return fallback;
    try { return JSON.parse(raw); } catch { return fallback; }
  }

  async function openConfigDialog() {
    const configUrl = new URL("config.html", window.location.href).toString();
    await tableau.extensions.ui.displayDialogAsync(configUrl, "", { height: 520, width: 520 });
  }

  async function getContextIdFromParam() {
    const dashboard = tableau.extensions.dashboardContent.dashboard;
    const params = await dashboard.getParametersAsync();
    const p = params.find(x => x.name === "p_context_id");
    if (!p) return null;
    const raw = p.currentValue && p.currentValue.value;
    const s = (raw === null || raw === undefined) ? "" : String(raw).trim();
    return s.length ? s : null;
  }

  async function runApply() {
    try {
      const worksheetName = tableau.extensions.settings.get("worksheetName") || "";
      const filterFieldNames = getJsonSetting("filterFieldNames", []);

      if (!worksheetName || !Array.isArray(filterFieldNames) || filterFieldNames.length === 0) {
        showStatus("Extension B non configurée.\n(Mode Edit → menu extension → Configure…)");
        return;
      }

      const contextId = await getContextIdFromParam();
      if (!contextId) {
        // Silent (normal if user opens B directly)
        showStatus(""); 
        return;
      }

      const dashboard = tableau.extensions.dashboardContent.dashboard;
      const ws = dashboard.worksheets.find(w => w.name === worksheetName);
      if (!ws) throw new Error(`Worksheet '${worksheetName}' introuvable.`);

      const resp = await fetch(`${API_BASE}/contexts/${encodeURIComponent(contextId)}`);
      if (!resp.ok) throw new Error(`GET /contexts failed: ${resp.status} ${await resp.text()}`);
      const data = await resp.json();
      const filters = data.filters || {};

      // Apply only configured filters (fieldName)
      for (const fieldName of filterFieldNames) {
        const values = filters[fieldName];
        if (!values || values.length === 0) continue; // ALL => do nothing
        await ws.applyFilterAsync(fieldName, values, tableau.FilterUpdateType.Replace);
      }

      showStatus(""); // keep invisible on success
    } catch (e) {
      console.error(e);
      showStatus(String(e));
    }
  }

  // Auto-apply on load
  runApply();
})();
</script>
</body>
</html>
