<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Context - Open B (A)</title>
  <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 10px; }
    button { width: 100%; padding: 10px 12px; font-size: 14px; }
    #status { margin-top: 8px; font-size: 12px; opacity: .75; white-space: pre-wrap; }
  </style>
</head>
<body>
  <button id="goBtn">Ouvrir l’analyse détaillée</button>
  <div id="status"></div>

<script>
(async () => {
  await tableau.extensions.initializeAsync({ configure: openConfigDialog });
  applyButtonUxFromSettings();

  // ✅ Hardcode API URL here
  const API_BASE = "https://tableau-filter-context-poc.onrender.com";

  const statusEl = document.getElementById("status");
  const status = (m) => { statusEl.textContent = m || ""; };

  function getJsonSetting(key, fallback) {
    const raw = tableau.extensions.settings.get(key);
    if (!raw) return fallback;
    try { return JSON.parse(raw); } catch { return fallback; }
  }
  
  async function openConfigDialog() {
    const configUrl = new URL("config.html", window.location.href).toString();
    const result = await tableau.extensions.ui.displayDialogAsync(
      configUrl,
      "",
      { height: 600, width: 520 }
    );
  
    // Si l’utilisateur a cliqué "Save" dans le dialog
    if (result === "saved") {
      await tableau.extensions.settings.refreshAsync(); // récupère les nouvelles valeurs
      applyButtonUxFromSettings();                      // applique immédiatement
    }
  }

  function mustGetConfig() {
    const targetUrl = tableau.extensions.settings.get("targetUrl") || "";
    const worksheetName = tableau.extensions.settings.get("worksheetName") || "";
    const filterFieldNames = getJsonSetting("filterFieldNames", []);
    return { targetUrl, worksheetName, filterFieldNames };
  }

  function applyButtonUxFromSettings() {
    const btn = document.getElementById("goBtn");
  
    const label = tableau.extensions.settings.get("buttonLabel");
    if (label) btn.textContent = label;
  
    const fg = tableau.extensions.settings.get("buttonFg");
    if (fg) btn.style.color = fg;
  
    const bg = tableau.extensions.settings.get("buttonBg");
    if (bg) btn.style.background = bg;
  
    // un peu de style par défaut
    btn.style.border = "1px solid transparent";
    btn.style.borderRadius = "10px";
  }


  document.getElementById("goBtn").addEventListener("click", async () => {
    let popup = null;
    try {
      popup = window.open("about:blank", "_blank"); // open immediately (popup-blocker safe)

      const { targetUrl, worksheetName, filterFieldNames } = mustGetConfig();
      if (!targetUrl || !worksheetName || !Array.isArray(filterFieldNames) || filterFieldNames.length === 0) {
        status("Extension non configurée.\n(Mode Edit → menu de l’extension → Configure…)"); 
        if (popup && !popup.closed) popup.close();
        return;
      }

      status("Lecture des filtres…");
      const dashboard = tableau.extensions.dashboardContent.dashboard;
      const ws = dashboard.worksheets.find(w => w.name === worksheetName);
      if (!ws) throw new Error(`Worksheet '${worksheetName}' introuvable.`);

      const wsFilters = await ws.getFiltersAsync();

      // Build payload: filter_fieldName -> [values] or null for ALL
      const payloadFilters = {};
      for (const fieldName of filterFieldNames) {
        const f = wsFilters.find(x => x.fieldName === fieldName);
        if (!f) continue;

        const isAll = (f.isAllSelected === true) || !f.appliedValues || f.appliedValues.length === 0;
        payloadFilters[fieldName] = isAll ? null : f.appliedValues.map(v => String(v.value));
      }

      status("Sauvegarde du contexte…");
      const resp = await fetch(`${API_BASE}/contexts`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filters: payloadFilters, ttl_hours: 24 })
      });

      if (!resp.ok) {
        const txt = await resp.text();
        throw new Error(`POST /contexts failed: ${resp.status} ${txt}`);
      }

      const { context_id } = await resp.json();

      // ✅ Pass context_id through Tableau parameter in B (no ":" for custom parameters)
      const joinChar = targetUrl.includes("?") ? "&" : "?";
      const url = `${targetUrl}${joinChar}p_context_id=${encodeURIComponent(context_id)}`;

      status(`Ouverture… (${context_id})`);
      if (popup && !popup.closed) popup.location.href = url;
      else window.open(url, "_blank");

      // optional: clear status after navigation
      // status("");
    } catch (e) {
      console.error(e);
      status(String(e));
      if (popup && !popup.closed) popup.close();
    }
  });
})();
</script>
</body>
</html>
