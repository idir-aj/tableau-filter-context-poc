<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Save Context & Navigate</title>
  <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 12px; }
    label { display:block; margin-top: 8px; }
    button { margin-top: 12px; padding: 8px 10px; }
    .small { opacity: .75; font-size: 12px; }
    input { width: 100%; padding: 6px; }
  </style>
</head>
<body>
  <h3>Open Workbook B</h3>

  <label>API Base URL</label>
  <input id="apiBase" value="https://YOUR_API_DOMAIN" />

  <label>Worksheet name (where filters are applied)</label>
  <input id="wsName" placeholder="ex: Overview" />

  <label>Target Workbook B URL (base)</label>
  <input id="targetUrl" placeholder="Paste full view URL of Workbook B (without context_id)" />

  <label>Filter field names (comma-separated)</label>
  <input id="filterNames" value="Pays,Produit,Categorie" />

  <button id="goBtn">Save filters & Open B</button>
  <div id="status" class="small"></div>

<script>
(async function () {
  await tableau.extensions.initializeAsync();

  const status = (msg) => document.getElementById("status").textContent = msg;

  function getAllSelectedValues(filter) {
    // filter.appliedValues is array of { value } objects
    // If "All" is selected, Tableau generally returns isAllSelected = true OR appliedValues empty depending on filter type.
    // We'll treat "all" as: filter.isAllSelected === true OR appliedValues is empty.
    const isAll = (filter.isAllSelected === true) || !filter.appliedValues || filter.appliedValues.length === 0;
    if (isAll) return null;
    return filter.appliedValues.map(v => String(v.value));
  }

  async function readFiltersFromWorksheet(worksheet, wantedNames) {
    const wsFilters = await worksheet.getFiltersAsync();
    const out = {};

    for (const name of wantedNames) {
      const f = wsFilters.find(x => x.fieldName === name || x.caption === name);
      if (!f) {
        // On ignore si le filtre n'existe pas dans ce worksheet (POC)
        continue;
      }
      const values = getAllSelectedValues(f);
      out[name] = values; // null => ALL
    }
    return out;
  }

  document.getElementById("goBtn").addEventListener("click", async () => {
    try {
      status("Reading filters…");

      const apiBase = document.getElementById("apiBase").value.replace(/\/$/, "");
      const wsName = document.getElementById("wsName").value.trim();
      const targetUrl = document.getElementById("targetUrl").value.trim();
      const filterNames = document.getElementById("filterNames").value.split(",").map(s => s.trim()).filter(Boolean);

      if (!apiBase || !wsName || !targetUrl || filterNames.length === 0) {
        status("Please fill API Base, worksheet name, target URL, and filter names.");
        return;
      }

      const dashboard = tableau.extensions.dashboardContent.dashboard;
      const worksheet = dashboard.worksheets.find(w => w.name === wsName);
      if (!worksheet) {
        status(`Worksheet '${wsName}' not found.`);
        return;
      }

      const filters = await readFiltersFromWorksheet(worksheet, filterNames);

      status("Saving context…");
      const resp = await fetch(`${apiBase}/contexts`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filters, ttl_hours: 24 })
      });
      if (!resp.ok) {
        const txt = await resp.text();
        throw new Error(`POST /contexts failed: ${resp.status} ${txt}`);
      }
      const data = await resp.json();
      const contextId = data.context_id;

      status(`Opening B with context_id=${contextId}…`);

      const joinChar = targetUrl.includes("?") ? "&" : "?";
      const url = `${targetUrl}${joinChar}context_id=${encodeURIComponent(contextId)}`;

      // Open in same tab
      //window.top.location.href = url;
      await tableau.extensions.ui.openUrlAsync(url);

    } catch (e) {
      status(String(e));
      console.error(e);
    }
  });
})();
</script>
</body>
</html>
